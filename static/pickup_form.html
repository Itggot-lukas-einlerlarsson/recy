
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Pickup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Schedule Pickup</h1>
    <form id="pickupForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="pickup_time">Pickup Time:</label>
            <input type="datetime-local" id="pickup_time" name="pickup_time" required>
        </div>

        <button type="submit">Schedule Pickup</button>
    </form>

    <div id="message" class="message"></div>

    <script>
        document.getElementById('pickupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const pickup = {
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                pickup_time: document.getElementById('pickup_time').value,
            };

            try {
                const response = await fetch('/pickup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(pickup),
                });

                const messageDiv = document.getElementById('message');
                messageDiv.style.display = 'block';

                if (response.ok) {
                    const data = await response.json();
                    messageDiv.className = 'message success';
                    messageDiv.textContent = data.message;
                    document.getElementById('pickupForm').reset();
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = `Error: ${response.statusText}`;
                }
            } catch (error) {
                const messageDiv = document.getElementById('message');
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
